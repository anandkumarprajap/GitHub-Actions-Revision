# Goal - I have to ensure the packages & dependencies have been audited for Security

name: Dependecy scan

on:
    workflow_call:

jobs:
    dependency-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                go-version: '1.23'
                go-version-file: 'backend/go.mod'
                cache-dependency-path: backend/go.sum

            - name: Install Govulncheck
              run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

            - name: GoVulncheck
              continue-on-error: true
              run: |
                mkdir -p ../reports
                govulncheck ./... > ../reports/govulncheck-report.txt || true
              working-directory: backend

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: frontend/package-lock.json

            - name: Run Dependency Scan for Node
              continue-on-error: true
              run: |
                mkdir -p ../reports
                npm audit > ../reports/dependency-report.txt || true
              working-directory: frontend

            - name: Upload Report to Artifacts
              if: always() # Ensures report uploads even if tests fail
              uses: actions/upload-artifact@v4
              with:
                name: dependency-scan-report
                path: reports/
                retention-days: 5

